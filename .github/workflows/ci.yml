name: CI

# Isaly App Foundation: formatting, lint, typecheck and build are blocking on every pull request.
# Migrations are checked after merge by migration-drift-check.yml.
#
# There is no test runner in this repository yet (no vitest, no tests). Add vitest as a
# devDependency together with the first tests, then add a `bunx vitest run` step here.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each step fails the job on a non-zero exit.
      - name: Prettier check
        run: bunx prettier --check .

      - name: ESLint
        run: bun run lint --max-warnings 0

      - name: Typecheck
        run: bunx tsc --noEmit -p .

      - name: Production build
        run: bun run build
